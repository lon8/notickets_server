name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature/*'
  pull_request:
    branches:
      - main
      - 'feature/*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'  # Укажите версию Python, которая используется в вашем проекте

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set Docker image tag
      id: vars
      run: |
        if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
          echo "TAG=stable" >> $GITHUB_ENV
        elif [[ "${GITHUB_REF}" == refs/heads/feature/* ]]; then
          echo "TAG=latest" >> $GITHUB_ENV
        else
          echo "TAG=unknown" >> $GITHUB_ENV
        fi

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Build and push Docker image
      if: env.TAG != 'unknown'
      run: |
        docker build -t your_dockerhub_username/your_image_name:${TAG} .
        docker push your_dockerhub_username/your_image_name:${TAG}
